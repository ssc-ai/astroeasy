# Build and publish astroeasy to PyPI when a GitHub Release is published.
#
# Trigger:   publishing a Release (not merges to main, not draft releases,
#            not prereleases -- see the `if:` guard on release-build).
# Auth:      PyPI Trusted Publishing (OIDC). No API token secret is used.
# Gate:      the `pypi` environment. Add required reviewers there so a human
#            must approve before anything reaches PyPI.
#
# One-time setup required before this can succeed -- see docs/RELEASING.md.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-build:
    # Never publish from a draft or a prerelease. Publishing a draft flips
    # `draft` to false before this fires, so the prerelease check is the one
    # that does the real work; the draft check is belt-and-braces.
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit the release tag points at, not the
          # branch head, so we build what was actually tagged.
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "pyproject.toml version: ${PROJECT_VERSION}"
          echo "release tag:            ${TAG}"
          if [ "${TAG}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Release tag '${TAG}' does not match pyproject.toml version '${PROJECT_VERSION}' (expected tag 'v${PROJECT_VERSION}'). Bump the version or retag."
            exit 1
          fi
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - name: Verify version is not already on PyPI
        run: |
          if curl -sf "https://pypi.org/pypi/astroeasy/${VERSION}/json" > /dev/null; then
            echo "::error::astroeasy ${VERSION} is already published on PyPI. Bump the version in pyproject.toml -- PyPI will not accept a re-upload."
            exit 1
          fi
          echo "PyPI check OK: ${VERSION} is not yet published"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[catalog,cascade,dev]"

      - name: Lint
        run: ruff check astroeasy/

      - name: Run tests
        # Tests that need astrometry.net, Docker, indices, or the downloaded
        # test-data bundle skip themselves (see tests/conftest.py).
        run: pytest tests/ -v

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify built artifacts carry the expected version
        run: |
          ls -l dist/
          test -f "dist/astroeasy-${VERSION}-py3-none-any.whl" || {
            echo "::error::Expected dist/astroeasy-${VERSION}-py3-none-any.whl, got: $(ls dist/)"; exit 1; }
          test -f "dist/astroeasy-${VERSION}.tar.gz" || {
            echo "::error::Expected dist/astroeasy-${VERSION}.tar.gz, got: $(ls dist/)"; exit 1; }

      - name: Verify vendored tetra3 Apache-2.0 license ships in the wheel
        run: |
          python -m zipfile -l "dist/astroeasy-${VERSION}-py3-none-any.whl" \
            | grep -q "astroeasy/_vendor/tetra3/LICENSE.txt" || {
              echo "::error::astroeasy/_vendor/tetra3/LICENSE.txt is missing from the wheel. Apache-2.0 requires the license to be redistributed with the vendored code."; exit 1; }
          echo "Vendored license present in wheel"

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # Mandatory for trusted publishing.
      id-token: write

    # Configure required reviewers on this environment in
    # Settings -> Environments -> pypi. The build above runs unattended;
    # this job waits for a human approval before uploading.
    environment:
      name: pypi
      # Tags are `v1.2.3` but PyPI URLs are `/1.2.3`, so link the project root.
      url: https://pypi.org/p/astroeasy

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
